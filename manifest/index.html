<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gözde Manifest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gözde Manifest: her gün üç manifest, her biri sekiz saat. Üç görsel, üç olumlama.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Yerleşim: tek sütun bir vizyon panosu. Üstte isim ve 8 saatlik halka sayaç, altında günün üç manifesti
   arasında sekme, sekmenin altında üç görsel kart ve her kartın altında olumlaması. */
:root {
  --zemin: #f7eff0;        /* inci pembesi */
  --yuzey: #fffafa;
  --murekkep: #2b1630;     /* koyu erik */
  --soluk: #7a6178;
  --cizgi: rgba(90, 40, 80, 0.14);
  --altin: #b7785e;        /* rose gold */
  --altin-acik: rgba(183, 120, 94, 0.14);
  --halka-zemin: rgba(90, 40, 80, 0.10);
  --golge: rgba(90, 30, 70, 0.14);
  --f-baslik: "Italiana", "Didot", "Bodoni 72", "Times New Roman", serif;
  --f-metin: "Manrope", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #1a1019; --yuzey: #251723; --murekkep: #f8e9ec; --soluk: #c2a7b8;
    --cizgi: rgba(248, 220, 230, 0.14); --altin: #e7ae93; --altin-acik: rgba(231, 174, 147, 0.14);
    --halka-zemin: rgba(248, 220, 230, 0.12); --golge: rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #1a1019; --yuzey: #251723; --murekkep: #f8e9ec; --soluk: #c2a7b8;
  --cizgi: rgba(248, 220, 230, 0.14); --altin: #e7ae93; --altin-acik: rgba(231, 174, 147, 0.14);
  --halka-zemin: rgba(248, 220, 230, 0.12); --golge: rgba(0, 0, 0, 0.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--zemin);
  color: var(--murekkep);
  font-family: var(--f-metin);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.sayfa { max-width: 1080px; margin: 0 auto; display: grid; gap: 32px; }

/* Başlık ve sayaç */
.ust { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.marka { display: grid; gap: 6px; min-width: 0; }
.etiket { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--altin); font-weight: 600; }
h1 { font-family: var(--f-baslik); font-weight: 400; font-size: clamp(2.6rem, 8vw, 4.6rem); line-height: 0.95; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--altin); }
.alt-baslik { margin: 6px 0 0; color: var(--soluk); max-width: 42ch; }

.sayac { position: relative; width: 168px; height: 168px; flex: none; }
.sayac svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.sayac .iz { fill: none; stroke: var(--halka-zemin); stroke-width: 6; }
.sayac .dolu { fill: none; stroke: var(--altin); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.sayac-ic { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.sayac-sure { font-size: 1.55rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.sayac-not { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--soluk); }

/* Sekmeler */
.sekmeler { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-bottom: 1px solid var(--cizgi); }
.sekme {
  appearance: none; border: 0; background: none; color: var(--soluk); font: inherit; cursor: pointer;
  padding: 12px 4px 14px; text-align: left; display: grid; gap: 2px; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.sekme b { font-family: var(--f-baslik); font-weight: 400; font-size: 1.45rem; color: var(--murekkep); line-height: 1.1; }
.sekme span { font-size: 0.75rem; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.sekme[aria-selected="true"] { border-bottom-color: var(--altin); }
.sekme[aria-selected="true"] span { color: var(--altin); }
.sekme.kilitli b { color: var(--soluk); }
.sekme:focus-visible { outline: 2px solid var(--altin); outline-offset: 2px; }

/* Kartlar */
.manifest-baslik { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
.manifest-baslik h2 { font-family: var(--f-baslik); font-weight: 400; font-size: 2rem; margin: 0; }
.manifest-baslik p { margin: 0; color: var(--soluk); font-size: 0.9rem; }
.kartlar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.kart { display: grid; grid-template-rows: auto 1fr; gap: 14px; min-width: 0; }
.gorsel {
  position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 4px; overflow: hidden;
  box-shadow: 0 18px 40px -22px var(--golge);
}
.gorsel svg, .gorsel img { display: block; width: 100%; height: 100%; object-fit: cover; }
.gorsel .ad {
  position: absolute; left: 14px; bottom: 12px; color: #fff; font-size: 0.7rem; letter-spacing: 0.2em;
  text-transform: uppercase; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,0.35);
}
.olumlama { margin: 0; font-family: var(--f-baslik); font-size: 1.35rem; line-height: 1.3; text-wrap: pretty; }
.olumlama::before { content: "“"; color: var(--altin); }
.olumlama::after { content: "”"; color: var(--altin); }

.kilit {
  display: grid; place-items: center; text-align: center; gap: 10px; padding: 64px 16px;
  border: 1px dashed var(--cizgi); border-radius: 4px; color: var(--soluk);
}
.kilit b { font-family: var(--f-baslik); font-weight: 400; font-size: 1.8rem; color: var(--murekkep); }
.kilit .sure { font-variant-numeric: tabular-nums; font-size: 1.2rem; color: var(--altin); font-weight: 500; }

.alt { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; border-top: 1px solid var(--cizgi); padding-top: 20px; }
.alt p { margin: 0; color: var(--soluk); font-size: 0.9rem; max-width: 60ch; }
.hissettim {
  appearance: none; font: inherit; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 12px 22px; border-radius: 999px; border: 1px solid var(--altin); background: transparent; color: var(--altin); cursor: pointer;
}
.hissettim[aria-pressed="true"] { background: var(--altin); color: var(--yuzey); }
.hissettim:focus-visible { outline: 2px solid var(--altin); outline-offset: 3px; }

@media (max-width: 760px) {
  .ust { grid-template-columns: 1fr; justify-items: start; }
  .sayac { width: 150px; height: 150px; }
  .kartlar { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .gorsel { aspect-ratio: 5 / 4; }
  .sekme b { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) { .sayac .dolu { transition: none; } }
</style>
</head>
<body>
<div class="sayfa">
  <header class="ust">
    <div class="marka">
      <span class="etiket" id="tarih">Bugün</span>
      <h1>Gözde <em>Manifest</em></h1>
      <p class="alt-baslik">Her gün üç manifest, her biri sekiz saat. Görsele bak, cümleyi içinden oku, zaten senin olduğunu hisset.</p>
    </div>
    <div class="sayac" aria-live="off">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="iz" cx="60" cy="60" r="54"></circle>
        <circle class="dolu" id="halka" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="sayac-ic">
        <span class="sayac-sure" id="sure">08:00:00</span>
        <span class="sayac-not" id="sayac-not">sonraki manifest</span>
      </div>
    </div>
  </header>

  <nav class="sekmeler" role="tablist" id="sekmeler"></nav>

  <main id="icerik"></main>

  <footer class="alt">
    <p id="alt-metin">Günün manifestleri 00:00, 08:00 ve 16:00'da açılır. Her gece yarısı üç yeni manifest hazırlanır.</p>
    <button class="hissettim" id="hissettim" type="button" aria-pressed="false">Okudum, hissettim</button>
  </footer>
</div>

    },
    kiyafet: function (u) {
      var s = gok(u, "#f1dcd8", "#d9b3ad");
      s += '<rect x="20" y="52" width="200" height="5" rx="2" fill="#8a6a50"/>';
      var renk = ["#2b1630", "#b7785e", "#f8f3ee", "#7d1f35"];
      for (var i = 0; i < 4; i++) {
        var x = 46 + i * 50;
        s += '<path d="M' + x + ' 57 q0 -8 6 -8" stroke="#8a6a50" stroke-width="2" fill="none"/>';
        s += '<path d="M' + (x - 14) + ' 70 L' + x + ' 62 L' + (x + 14) + ' 70 Z" fill="none" stroke="#8a6a50" stroke-width="2"/>';
        s += '<path d="M' + (x - 10) + ' 72 L' + (x + 10) + ' 72 L' + (x + 8) + ' 120 L' + (x + 26) + ' ' + (232 - (i % 2) * 20) + ' L' + (x - 26) + ' ' + (232 - (i % 2) * 20) + ' L' + (x - 8) + ' 120 Z" fill="' + renk[i] + '"/>';
        s += '<rect x="' + (x - 9) + '" y="116" width="18" height="4" fill="#e2c27c" opacity="0.8"/>';
      }
      return s + '<rect x="0" y="262" width="240" height="38" fill="#c79e97"/>' + parilti(206, 96, 7);
    },
    ayakkabi: function (u) {
      var s = gok(u, "#2b1630", "#4f2440");
      s += '<rect x="0" y="232" width="240" height="68" fill="#3a1c33"/><ellipse cx="120" cy="234" rx="96" ry="7" fill="#000" opacity="0.35"/>';
      s += '<path d="M46 146 C42 160 42 172 46 180 C70 186 110 206 150 224 L204 226 C212 226 214 218 208 212 C198 202 176 198 150 196 C116 194 84 178 62 156 Z" fill="#d4324f"/>';
      s += '<path d="M46 180 C70 186 110 206 150 224 L204 226" stroke="#1a0b16" stroke-width="3" fill="none"/>';
      s += '<path d="M44 176 L54 176 L60 232 L55 232 Z" fill="#1a0b16"/>';
      s += '<path d="M62 156 C84 178 116 194 150 196" stroke="#f1b2bf" stroke-width="2" fill="none" opacity="0.6"/>';
      return s + parilti(186, 86, 10, "#f6c9a8") + parilti(60, 70, 6, "#f6c9a8");
    },
    canta: function (u) {
      var s = gok(u, "#efe1d2", "#d7bfa6");
      s += '<rect x="0" y="246" width="240" height="54" fill="#c4a689"/><ellipse cx="120" cy="248" rx="82" ry="6" fill="#000" opacity="0.18"/>';
      s += '<path d="M84 118 C84 78 156 78 156 118" stroke="#6d3a22" stroke-width="9" fill="none" stroke-linecap="round"/>';
      s += '<path d="M48 120 L192 120 L204 244 L36 244 Z" fill="#8b4a2b"/><path d="M48 120 L192 120 L196 164 L44 164 Z" fill="#7a3f24"/>';
      s += '<rect x="108" y="156" width="24" height="18" rx="3" fill="#e2c27c"/><rect x="116" y="162" width="8" height="6" fill="#8b4a2b"/>';
      s += '<path d="M52 230 L188 230" stroke="#6d3a22" stroke-width="2" stroke-dasharray="4 4"/>';
      return s + parilti(200, 70, 8, "#fff");
    },
    yat: function (u) {
      var s = gok(u, "#7fc6e6", "#e6f5fb");
      s += '<rect x="0" y="186" width="240" height="114" fill="#1f8fb4"/><rect x="0" y="186" width="240" height="20" fill="#43aacb"/>';
      s += '<path d="M10 224 q16 -6 32 0 t32 0 M150 250 q16 -6 32 0 t32 0 M60 272 q16 -6 32 0" stroke="#bfe6f3" stroke-width="2" fill="none"/>';
      s += '<path d="M18 176 L222 176 L196 208 L46 208 Z" fill="#fbfbfb"/><path d="M46 208 L196 208 L200 202 L42 202 Z" fill="#203a57"/>';
      s += '<path d="M60 176 L76 148 L178 148 L194 176 Z" fill="#f2f2f2"/><path d="M86 154 L170 154 L178 170 L80 170 Z" fill="#203a57"/>';
      s += '<path d="M100 148 L110 128 L160 128 L168 148 Z" fill="#ececec"/><path d="M116 132 L156 132 L160 144 L112 144 Z" fill="#203a57"/>';
      s += '<rect x="136" y="104" width="3" height="24" fill="#9aa4b1"/>';
      return s + '<circle cx="50" cy="66" r="20" fill="#fff6d8"/>';
    },
    saat: function (u) {
      var s = gok(u, "#1c2233", "#0b0e17");
      s += '<rect x="96" y="0" width="48" height="300" fill="#6e4b36"/><rect x="96" y="0" width="48" height="300" fill="url(#g' + u + ')" opacity="0.25"/>';
      for (var i = 0; i < 9; i++) s += '<rect x="102" y="' + (10 + i * 32) + '" width="36" height="2" fill="#5a3b29"/>';
      s += '<circle cx="120" cy="150" r="66" fill="#d7b46a"/><circle cx="120" cy="150" r="58" fill="#0f1b2e"/><circle cx="120" cy="150" r="56" fill="none" stroke="#d7b46a" stroke-width="1"/>';
      for (var k = 0; k < 12; k++) {
        var a = k * Math.PI / 6, x1 = 120 + Math.sin(a) * 48, y1 = 150 - Math.cos(a) * 48, x2 = 120 + Math.sin(a) * 54, y2 = 150 - Math.cos(a) * 54;
        s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#d7b46a" stroke-width="' + (k % 3 ? 1.5 : 3) + '"/>';
      }
      s += '<line x1="120" y1="150" x2="120" y2="112" stroke="#f3e5c0" stroke-width="3" stroke-linecap="round"/><line x1="120" y1="150" x2="150" y2="164" stroke="#f3e5c0" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="150" r="4" fill="#d7b46a"/>';
      return s + '<rect x="186" y="144" width="10" height="12" rx="2" fill="#d7b46a"/>';
    },
    mucevher: function (u) {
      var s = gok(u, "#3b1f4a", "#120a1a");
      s += '<path d="M76 110 L164 110 L190 140 L120 232 L50 140 Z" fill="#cfe9f6"/>';
      s += '<path d="M76 110 L98 140 L120 110 L142 140 L164 110" fill="none" stroke="#7fb0cf" stroke-width="2"/><path d="M50 140 L190 140" stroke="#7fb0cf" stroke-width="2"/>';
      s += '<path d="M98 140 L120 232 L142 140" fill="none" stroke="#7fb0cf" stroke-width="2"/><path d="M76 110 L98 140 L50 140 Z" fill="#e9f6fc"/><path d="M142 140 L164 110 L190 140 Z" fill="#a9d2e8"/>';
      s += '<path d="M120 232 L142 140 L190 140 Z" fill="#9cc8e0"/>';
      return s + parilti(186, 92, 12) + parilti(58, 96, 8) + parilti(172, 214, 7) + parilti(70, 220, 5);
    },
    ada: function (u) {
      var s = gok(u, "#ffd3a8", "#7fd3dc");
      s += '<circle cx="168" cy="82" r="22" fill="#fff1d2"/><rect x="0" y="160" width="240" height="140" fill="#2bb5bf"/><rect x="0" y="160" width="240" height="30" fill="#6fd3d6"/>';
      s += '<rect x="20" y="206" width="200" height="5" fill="#a4835e"/>';
      for (var i = 0; i < 3; i++) {
        var x = 30 + i * 66;
        s += '<rect x="' + (x + 6) + '" y="190" width="3" height="40" fill="#7a5a3a"/><rect x="' + (x + 36) + '" y="190" width="3" height="40" fill="#7a5a3a"/>';
        s += '<rect x="' + x + '" y="168" width="48" height="24" fill="#c6a073"/><path d="M' + (x - 6) + ' 170 L' + (x + 24) + ' 140 L' + (x + 54) + ' 170 Z" fill="#8e6a44"/><rect x="' + (x + 18) + '" y="176" width="12" height="16" fill="#5a3d24"/>';
      }
      return s + '<path d="M30 260 q14 -6 28 0 t28 0 M140 274 q14 -6 28 0 t28 0" stroke="#bff0ef" stroke-width="2" fill="none"/>';
    },
    parfum: function (u) {
      var s = gok(u, "#f4d6e0", "#d39bb2");
      s += '<rect x="0" y="240" width="240" height="60" fill="#c58aa3"/><ellipse cx="120" cy="242" rx="70" ry="6" fill="#000" opacity="0.15"/>';
      s += '<rect x="104" y="80" width="32" height="34" rx="4" fill="#2b1630"/><rect x="110" y="110" width="20" height="14" fill="#d7b46a"/>';
      s += '<rect x="62" y="122" width="116" height="120" rx="10" fill="#fbe9f0" opacity="0.85"/><rect x="70" y="150" width="100" height="84" rx="6" fill="#f2a7c0" opacity="0.8"/>';
      s += '<rect x="90" y="168" width="60" height="30" fill="#fff" opacity="0.9"/><rect x="100" y="180" width="40" height="2" fill="#2b1630"/><rect x="108" y="186" width="24" height="2" fill="#2b1630"/>';
      return s + '<rect x="72" y="128" width="6" height="100" rx="3" fill="#fff" opacity="0.7"/>' + parilti(196, 70, 9);
    },
    sampanya: function (u) {
      var s = gok(u, "#3a1f2e", "#1a0d16");
      function kadeh(x, aci) {
        return '<g transform="rotate(' + aci + ' ' + x + ' 230)"><path d="M' + (x - 18) + ' 70 L' + (x + 18) + ' 70 L' + (x + 14) + ' 160 C' + (x + 12) + ' 172 ' + (x - 12) + ' 172 ' + (x - 14) + ' 160 Z" fill="#f7e9c6" opacity="0.25" stroke="#f7e9c6" stroke-width="2"/>' +
          '<path d="M' + (x - 16) + ' 100 L' + (x + 16) + ' 100 L' + (x + 14) + ' 160 C' + (x + 12) + ' 170 ' + (x - 12) + ' 170 ' + (x - 14) + ' 160 Z" fill="#e8c66c"/>' +
          '<rect x="' + (x - 1.5) + '" y="168" width="3" height="60" fill="#f7e9c6"/><rect x="' + (x - 18) + '" y="226" width="36" height="4" rx="2" fill="#f7e9c6"/></g>';
      }
      s += kadeh(96, -10) + kadeh(144, 10);
      for (var i = 0; i < 9; i++) s += '<circle cx="' + (80 + (i * 37) % 80) + '" cy="' + (40 + (i * 23) % 50) + '" r="' + (2 + i % 3) + '" fill="#f7e9c6" opacity="0.7"/>';
      return s + parilti(120, 60, 12, "#f3dfa8") + parilti(40, 120, 6, "#f3dfa8") + parilti(204, 150, 7, "#f3dfa8");
    },
    altin: function (u) {
      var s = gok(u, "#2a2014", "#120d07");
      function kulce(x, y) {
        return '<path d="M' + x + ' ' + y + ' L' + (x + 56) + ' ' + y + ' L' + (x + 64) + ' ' + (y + 26) + ' L' + (x - 8) + ' ' + (y + 26) + ' Z" fill="#e2b552"/><path d="M' + x + ' ' + y + ' L' + (x + 56) + ' ' + y + ' L' + (x + 52) + ' ' + (y + 8) + ' L' + (x + 4) + ' ' + (y + 8) + ' Z" fill="#f6d98a"/>';
      }
      s += kulce(40, 214) + kulce(108, 214) + kulce(176, 214) + kulce(74, 186) + kulce(142, 186) + kulce(108, 158);
      return s + '<rect x="0" y="240" width="240" height="60" fill="#0b0804"/>' + parilti(150, 120, 12, "#fff3c4") + parilti(70, 140, 7, "#fff3c4") + parilti(200, 90, 6, "#fff3c4");
    }
  };

  function gorselHTML(d) {
    if (d.foto) return '<img src="' + d.foto + '" alt="' + d.ad + '">';
    sayac += 1;
    return '<svg viewBox="0 0 240 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + d.ad + '">' + CIZIM[d.id](sayac) + '</svg>';
  }

  // ---- Günün seçimi (tarihe göre sabit) ----
  function tohum(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return h >>> 0;
  }
  function rastgele(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gunAnahtari(t) {
    return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  }
  function gununManifestleri(anahtar) {
    var r = rastgele(tohum(anahtar));
    var liste = DILEKLER.slice();
    for (var i = liste.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var g = liste[i]; liste[i] = liste[j]; liste[j] = g; }
    var sonuc = [];
    for (var m = 0; m < 3; m++) {
      sonuc.push(liste.slice(m * 3, m * 3 + 3).map(function (d) {
        return { d: d, cumle: d.olumlamalar[Math.floor(r() * d.olumlamalar.length)] };
      }));
    }
    return sonuc;
  }

  // ---- Durum ----
  var ADLAR = ["Birinci manifest", "İkinci manifest", "Üçüncü manifest"];
  var SAATLER = ["00:00 – 08:00", "08:00 – 16:00", "16:00 – 24:00"];
  var bugun = "", manifestler = null, aktif = -1, secili = -1;

  function depo(anahtar, deger) {
    try {
      if (deger === undefined) return localStorage.getItem(anahtar);
      localStorage.setItem(anahtar, deger);
    } catch (e) { return null; }
  }

  function bicim(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), d = Math.floor((s % 3600) / 60), sn = s % 60;
    return String(h).padStart(2, "0") + ":" + String(d).padStart(2, "0") + ":" + String(sn).padStart(2, "0");
  }

  function sekmeleriCiz(simdi) {
    var html = "";
    for (var i = 0; i < 3; i++) {
      var kilitli = i > aktif;
      var alt = kilitli ? "Kilitli · " + SAATLER[i].slice(0, 5) + "'te açılır" : (i === aktif ? "Şu an · " + SAATLER[i] : "Açıldı · " + SAATLER[i]);
      html += '<button class="sekme' + (kilitli ? " kilitli" : "") + '" role="tab" id="sekme-' + i + '" aria-selected="' + (i === secili) + '" data-i="' + i + '"><b>' + ADLAR[i] + '</b><span>' + alt + '</span></button>';
    }
    document.getElementById("sekmeler").innerHTML = html;
  }

  function icerikCiz(simdi) {
    var kutu = document.getElementById("icerik");
    if (secili > aktif) {
      kutu.innerHTML = '<div class="kilit"><b>' + ADLAR[secili] + '</b><span>Bu manifest ' + SAATLER[secili].slice(0, 5) + '\'te açılacak.</span><span class="sure" id="kilit-sure"></span></div>';
      kilitSuresi(simdi);
      return;
    }
    var html = '<section class="manifest" role="tabpanel" aria-labelledby="sekme-' + secili + '"><div class="manifest-baslik"><h2>' + ADLAR[secili] + '</h2><p>' + SAATLER[secili] + '</p></div><div class="kartlar">';
    manifestler[secili].forEach(function (k) {
      html += '<article class="kart"><div class="gorsel">' + gorselHTML(k.d) + '<span class="ad">' + k.d.ad + '</span></div><p class="olumlama">' + k.cumle + '</p></article>';
    });
    kutu.innerHTML = html + '</div></section>';
    hissettimGuncelle();
  }

  function kilitSuresi(simdi) {
    var el = document.getElementById("kilit-sure");
    if (!el) return;
    var acilis = new Date(simdi); acilis.setHours(secili * 8, 0, 0, 0);
    el.textContent = bicim(acilis - simdi);
  }

  function hissettimGuncelle() {
    var b = document.getElementById("hissettim");
    var kilitli = secili > aktif;
    b.hidden = kilitli;
    var on = depo("gozde-manifest:" + bugun + ":" + secili) === "1";
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Evrene gönderildi" : "Okudum, hissettim";
  }

  function tik() {
    var simdi = new Date();
    var anahtar = gunAnahtari(simdi);
    var dilim = Math.min(2, Math.floor(simdi.getHours() / 8));
    if (anahtar !== bugun || dilim !== aktif) {
      var oncekiAktif = aktif;
      if (anahtar !== bugun) { bugun = anahtar; manifestler = gununManifestleri(anahtar); }
      aktif = dilim;
      if (secili === -1 || secili === oncekiAktif || secili > 2) secili = aktif;
      document.getElementById("tarih").textContent = simdi.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
      sekmeleriCiz(simdi);
      icerikCiz(simdi);
    }
    var bitis = new Date(simdi); bitis.setHours((aktif + 1) * 8, 0, 0, 0);
    var kalan = bitis - simdi;
    document.getElementById("sure").textContent = bicim(kalan);
    document.getElementById("sayac-not").textContent = aktif < 2 ? ADLAR[aktif + 1].split(" ")[0].toLowerCase() + " manifest" : "yarının manifesti";
    var cevre = 2 * Math.PI * 54;
    var halka = document.getElementById("halka");
    halka.style.strokeDasharray = cevre.toFixed(2);
    halka.style.strokeDashoffset = (cevre * (kalan / SEKIZ_SAAT)).toFixed(2);
    kilitSuresi(simdi);
  }

  document.getElementById("sekmeler").addEventListener("click", function (e) {
    var b = e.target.closest(".sekme");
    if (!b) return;
    secili = Number(b.getAttribute("data-i"));
    var simdi = new Date();
    sekmeleriCiz(simdi);
    icerikCiz(simdi);
    hissettimGuncelle();
  });
  document.getElementById("hissettim").addEventListener("click", function () {
    var k = "gozde-manifest:" + bugun + ":" + secili;
    depo(k, depo(k) === "1" ? "0" : "1");
    hissettimGuncelle();
  });

  tik();
  setInterval(tik, 1000);
})();
</script>
